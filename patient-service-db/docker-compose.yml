version: "3.9"

services:
  patient-service-db:
    image: postgres:latest
    container_name: patient-service-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: patient_service

    ports:
      - "5000:5432"

    volumes:
      - ./patient-service-db:/var/lib/postgresql

    networks:
      - internal

networks:
  internal:
    external: true