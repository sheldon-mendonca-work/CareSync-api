syntax = "proto3"; // version

option java_multiple_files = true; // split service request and response to different files
option java_package = "billing";

service BillingService {
    rpc CreateBillingAccount(BillingRequest) returns (BillingResponse);
}

message BillingRequest {
    string patientId = 1; // for serialization and deserialization purposes. has to be unique
    string name = 2;
    string email = 3;
}

message BillingResponse {
    string accountId = 1;
    string status = 2;
}